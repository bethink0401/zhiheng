  <path d="M214 458 C190 578 282 675 410 684" fill="none" stroke="#75A6B8" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M538 695 C642 768 802 770 906 704" fill="none" stroke="#75A6B8" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1032 683 C1160 677 1257 581 1246 456" fill="none" stroke="#75A6B8" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1243 326 C1194 219 1057 182 932 250" fill="none" stroke="#75A6B8" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M807 227 C730 181 650 191 579 241" fill="none" stroke="#75A6B8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)"><rect x="120" y="292" width="330" height="180" rx="34" fill="#FFFFFF"/><circle cx="176" cy="348" r="28" fill="#E6F4FF"/><text x="176" y="357" text-anchor="middle" class="step">01</text><text x="220" y="348" class="node-title">多源健康事实</text><text x="166" y="398" class="node-sub">可穿戴设备、主观感受、生活情境</text><text x="166" y="430" class="node-sub">经授权后统一结构化处理</text></g>
  <g filter="url(#shadow)"><rect x="360" y="620" width="360" height="170" rx="34" fill="#FFFFFF"/><circle cx="418" cy="676" r="28" fill="#EAF9F4"/><text x="418" y="685" text-anchor="middle" class="step">02</text><text x="462" y="676" class="node-title">质量判断与个人基线</text><text x="408" y="726" class="node-sub">识别缺失、断档、异常和来源变化</text><text x="408" y="757" class="node-sub">优先与过去的自己比较</text></g>
  <g filter="url(#shadow)"><rect x="850" y="620" width="360" height="170" rx="34" fill="#FFFFFF"/><circle cx="908" cy="676" r="28" fill="#FFF4DD"/><text x="908" y="685" text-anchor="middle" class="step">04</text><text x="952" y="676" class="node-title">个性化微计划</text><text x="898" y="726" class="node-sub">一次一个3—7天低风险行动</text><text x="898" y="757" class="node-sub">用户确认后才进入执行</text></g>
  <g filter="url(#shadow)"><rect x="1150" y="292" width="330" height="180" rx="34" fill="#FFFFFF"/><circle cx="1206" cy="348" r="28" fill="#F0EDFF"/><text x="1206" y="357" text-anchor="middle" class="step">05</text><text x="1250" y="348" class="node-title">执行与效果验证</text><text x="1196" y="398" class="node-sub">完成率、客观变化、主观反馈</text><text x="1196" y="430" class="node-sub">数据质量共同决定证据强度</text></g>
  <g filter="url(#shadow)"><rect x="610" y="175" width="380" height="170" rx="34" fill="#FFFFFF"/><circle cx="668" cy="231" r="28" fill="#E8F6FF"/><text x="668" y="240" text-anchor="middle" class="step">03</text><text x="712" y="231" class="node-title">AI可解释洞察</text><text x="658" y="281" class="node-sub">事实、可能因素、不确定性、行动</text><text x="658" y="312" class="node-sub">回答可追溯到数据与时间范围</text></g>

  <g filter="url(#shadow)"><circle cx="800" cy="470" r="150" fill="url(#core)"/><text x="800" y="445" text-anchor="middle" class="core-title">AI健康智能体</text><text x="800" y="490" text-anchor="middle" class="core-sub">理解问题 · 选择事实 · 补充情境</text><text x="800" y="523" text-anchor="middle" class="core-sub">解释变化 · 匹配行动 · 总结结果</text></g>
  <g filter="url(#shadow)"><rect x="1230" y="650" width="270" height="112" rx="28" fill="#173544"/><text x="1365" y="696" text-anchor="middle" class="node-title" fill="#FFFFFF" style="fill:#fff">我的有效方法</text><text x="1365" y="731" text-anchor="middle" class="node-sub" fill="#DCEEF3" style="fill:#dceef3">多次验证，长期积累</text></g>
