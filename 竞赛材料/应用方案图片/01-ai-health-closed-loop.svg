<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5FAFF"/><stop offset="1" stop-color="#F4FFF9"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2997FF"/><stop offset="1" stop-color="#31D6B2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#246A8A" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0 0 L10 5.5 L0 11 Z" fill="#75A6B8"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#173544}
      .title{font-size:42px;font-weight:700}.sub{font-size:21px;fill:#58717C}.node-title{font-size:25px;font-weight:700}.node-sub{font-size:18px;fill:#607986}.core-title{font-size:34px;font-weight:700;fill:white}.core-sub{font-size:19px;fill:white}.step{font-size:17px;font-weight:700;fill:#2783A8}
    </style>
  </defs>
  <rect width="1600" height="900" rx="40" fill="url(#bg)"/>
  <text x="100" y="90" class="title">AI驱动的个人健康行动闭环</text>
  <text x="100" y="130" class="sub">从多源健康事实到个人方法积累，每一次建议都接受真实行动结果的验证</text>

